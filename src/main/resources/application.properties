spring.application.name=marketplace-desafio-api
server.port=${SERVER_PORT:8082}

# h2 ou postgres. Troque aqui, ou exporte DB_PROFILE=postgres
spring.profiles.active=${DB_PROFILE:h2}

# As entidades criam ou atualizam as tabelas nos dois bancos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger e OpenAPI.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# BCrypt e JWT.
security.password.bcrypt-strength=${BCRYPT_STRENGTH:12}
security.jwt.secret=${JWT_SECRET:c2VncmVkby1qd3QtZGlkYXRpY28tMzItYnl0ZXMtMTIzNDU2Nzg=}
security.jwt.issuer=${JWT_ISSUER:marketplace-desafio-api}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

server.error.include-message=always
